/api/users/{uid}/documents:
    post:
      summary: Subir un documento para el usuario
      tags:
        - Users
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: ID del usuario en MongoDB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
                  description: Archivo físico a subir
                docType:
                  type: string
                  enum: [identification, address_proof, account_statement, license]
                  description: Tipo de documento
              required:
                - document
                - docType
      responses:
        '200':
          description: Documento subido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Documento subido y metadatos registrados correctamente
                  payload:
                    $ref: '#/components/schemas/DocumentMetadata'
        '400':
          description: Archivo faltante, tipo inválido o error de Multer
        '404':
          description: Usuario no encontrado