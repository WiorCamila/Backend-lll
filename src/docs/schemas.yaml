DocumentMetadata:
      type: object
      properties:
        name:
          type: string
          example: mi-dni.pdf
        originalName:
          type: string
          example: mi-dni.pdf
        filename:
          type: string
          example: document-1725301234567-890123456.pdf
        reference:
          type: string
          example: uploads/documents/document-1725301234567-890123456.pdf
        docType:
          type: string
          example: identification
        mimetype:
          type: string
          example: application/pdf
        size:
          type: integer
          example: 232925
        uploadedAt:
          type: string
          format: date-time
          example: '2026-09-02T21:12:54.065Z'